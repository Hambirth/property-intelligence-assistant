[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "property-intelligence-api"
version = "0.1.0"
description = "FastAPI foundation for the DarGlobal and Wasalt property intelligence assistant"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.19.1",
  "asyncpg==0.31.0",
  "beautifulsoup4==4.15.0",
  "defusedxml==0.7.1",
  "fastapi==0.141.1",
  "greenlet==3.3.2",
  "httpx==0.28.1",
  "numpy==2.5.2",
  "pgvector==0.5.0",
  "pypdf==6.15.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "sqlalchemy==2.0.52",
  "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
local-embeddings = [
  "sentence-transformers==6.0.0",
  "torch==2.13.0",
]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires an external dependency such as PostgreSQL",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]
"tests/**/*.py" = ["S105", "S106"]
